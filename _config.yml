```yaml
title: "Cybersecurity CTF Portfolio"
description: "Professional cybersecurity CTF, penetration testing, and security research documentation."

theme: jekyll-theme-primer

markdown: kramdown

kramdown:
  input: GFM

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

include:
  - docs

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
```
