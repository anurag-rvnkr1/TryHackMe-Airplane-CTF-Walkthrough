<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <meta
    name="theme-color"
    content="#050807"
  >

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <link
    rel="stylesheet"
    href="{{ '/assets/css/custom.css' | relative_url }}"
  >

</head>

<body>

  <header class="portfolio-header">

    <div class="portfolio-header-inner">

      <a
        href="{{ '/' | relative_url }}"
        class="portfolio-brand"
      >

        <span class="portfolio-brand-symbol">
          &gt;_
        </span>

        <span class="portfolio-brand-text">
          CYBERSECURITY CTF PORTFOLIO
        </span>

      </a>

      <div class="portfolio-status">

        <span class="status-indicator"></span>

        SECURITY RESEARCH

      </div>

    </div>

  </header>


  <main
    id="main-content"
    class="site-main"
  >

    <article class="markdown-body">

      {{ content }}

    </article>

  </main>


  <footer class="portfolio-global-footer">

    <div class="portfolio-footer-inner">

      <span>
        CYBERSECURITY CTF PORTFOLIO
      </span>

      <span class="footer-separator">
        //
      </span>

      <span>
        SECURITY RESEARCH • PRACTICE • DEFENSE
      </span>

    </div>

  </footer>

</body>

</html>
